[project]
name = "better-mad"
version = "0.2.0"
description = "Agent-driven visualization of seismic attributes from tabular text files"
readme = "README.md"
authors = [
    { name = "Alexander Milekhin", email = "kensei.trg@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "holoviews>=1.19",
    "panel>=1.5",
    "datashader>=0.16",
    "fastapi>=0.162.2",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.33",
]

[project.scripts]
better-mad = "better_mad.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.62.0",
    "pytest>=8",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.6",
    "ty>=0.0.1a15",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "C4",            # comprehensions
    "RUF",           # ruff-specific
]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Hub tests share one event loop for the whole session so a single spawned
# render worker + manager can live across tests (spawn costs ~3–5 s).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
