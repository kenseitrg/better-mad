[project]
name = "better-mad"
version = "0.1.0"
description = "Interactive visualization of seismic attributes from tabular text files"
readme = "README.md"
authors = [
    { name = "Alexander Milekhin", email = "kensei.trg@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "numexpr>=2.10",
    "holoviews>=1.19",
    "panel>=1.5",
    "datashader>=0.16",
    "scipy>=1.17.1",
]

[project.scripts]
better-mad = "better_mad.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "ty>=0.0.1a15",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM",           # simplify
    "C4",            # comprehensions
    "RUF",           # ruff-specific
]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
